name: audit

permissions:
  contents: read

# New advisories arrive without any change here, so check the lock file weekly.
# cargo audit fails on vulnerabilities; cargo deny applies deny.toml's policy on
# unmaintained crates.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 1'

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  audit:
    name: security advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain from rust-toolchain.toml
        # GitHub's runners carry rustup; act's images do not, so it is installed there first.
        run: |
          if ! command -v rustup >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup show active-toolchain || rustup toolchain install
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny
      - run: cargo audit
      - run: cargo deny check advisories
