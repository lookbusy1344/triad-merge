name: triad

permissions:
  contents: read

# Docs-only changes run nothing. The weekly run catches breakage from outside the
# repository: a new stable Rust (rust-toolchain.toml follows the channel), new lints,
# new runner images.
on:
  push:
    branches: [ main ]
    paths-ignore: [ 'docs/**', '**/*.md', 'images/**', 'LICENSE' ]
  pull_request:
    paths-ignore: [ 'docs/**', '**/*.md', 'images/**', 'LICENSE' ]
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * 1'

concurrency:
  group: triad-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  checks:
    name: format, workspace rules, dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain from rust-toolchain.toml
        # GitHub's runners carry rustup; act's images do not, so it is installed there first.
        run: |
          if ! command -v rustup >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup show active-toolchain || rustup toolchain install
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo fmt --all --check
      - run: script/check-workspace
      - run: cargo deny check

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    runs-on: ${{ matrix.os }}
    env:
      # Full debug info for the GPUI tree fills the Linux runner's disk. Line tables keep
      # file and line numbers in panics and backtraces.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v5
      - name: Free disk space
        if: runner.os == 'Linux'
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Install Linux system packages
        if: runner.os == 'Linux'
        run: >
          sudo apt-get update && sudo apt-get install -y
          pkg-config libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev
          libxcb1-dev libvulkan-dev libfontconfig-dev libfreetype-dev libasound2-dev libzstd-dev
      - name: Install toolchain from rust-toolchain.toml
        # GitHub's runners carry rustup; act's images do not, so it is installed there first.
        run: |
          if ! command -v rustup >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup show active-toolchain || rustup toolchain install
      # Only main saves the cache, so branches cannot push main's out of the 10 GB limit.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      # Clippy on every platform: the code has per-platform cfg branches.
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo nextest run --workspace --profile ci --locked
      - name: Doc tests
        if: runner.os == 'Linux'
        run: cargo test --doc --workspace --locked

  package:
    name: Linux packages
    # The container image and AppImage smoke tests are slow; run them by hand or weekly.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Let the Linux test machine write its results
        run: mkdir -p target/linux && chmod a+w target/linux
      - run: script/linux/run image
      - name: Headless and tool-integration tests on the release build
        run: >
          script/linux/run cargo nextest run --locked --cargo-profile release -p triad-merge
          -E 'test(/^(headless|tool_integration)::/)'
      - run: script/linux/run script/package x86_64-unknown-linux-gnu
      - name: Name the AppImage as script/package does
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          echo "APPIMAGE=/out/dist/triad-merge-$version-x86_64-unknown-linux-gnu.AppImage" >> "$GITHUB_ENV"
      - name: Smoke test the AppImage on Wayland
        run: script/linux/run env APPIMAGE_EXTRACT_AND_RUN=1 "TRIAD_APP=$APPIMAGE" script/linux/smoke wayland
      - name: Smoke test the AppImage on X11
        run: script/linux/run env APPIMAGE_EXTRACT_AND_RUN=1 "TRIAD_APP=$APPIMAGE" script/linux/smoke x11
      - uses: actions/upload-artifact@v4
        with:
          name: triad-linux
          path: target/linux/dist/
