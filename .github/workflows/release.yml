name: release

permissions:
  contents: read

# A tag vX.Y.Z runs the test suite of triad.yml on every platform, ARM64 Linux and Windows
# included, then builds the packages of each target and publishes them as a release, with
# notes GitHub generates from the commits since the last tag. The tag must match the workspace
# version. A failure on any platform builds and publishes nothing. A manual run tests and
# builds the packages as workflow artifacts only.
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  version:
    name: version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - id: version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Tag matches the workspace version
        if: github.ref_type == 'tag'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          [[ $GITHUB_REF_NAME == "v$VERSION" ]] || {
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $VERSION"
            exit 1
          }

  test:
    name: test
    needs: version
    uses: ./.github/workflows/triad.yml
    with:
      release: true

  macos:
    name: macOS ARM64
    needs: [ version, test ]
    runs-on: macos-latest
    env:
      NAME: triad-merge-${{ needs.version.outputs.version }}-aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v5
      - run: rustup update --no-self-update stable && rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: false
      - run: script/macos-app dist
      - name: Archive the app bundle
        run: |
          mkdir -p dist
          ditto -c -k --keepParent target/dist/triad.app "dist/$NAME.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: triad-macos
          path: dist/

  windows:
    name: Windows ${{ matrix.name }}
    needs: [ version, test ]
    strategy:
      matrix:
        include:
          - { name: x64, arch: x86_64, runner: windows-latest }
          - { name: ARM64, arch: aarch64, runner: windows-11-arm }
    runs-on: ${{ matrix.runner }}
    env:
      NAME: triad-merge-${{ needs.version.outputs.version }}-${{ matrix.arch }}-pc-windows-msvc
    steps:
      - uses: actions/checkout@v5
      - run: rustup update --no-self-update stable && rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: false
      - run: |
          eval "$(script/build-id)"
          cargo build --profile dist --locked -p triad-merge
      - name: Archive both binaries
        run: |
          stage=stage/$NAME
          mkdir -p "$stage" dist
          cp target/dist/triad-merge.exe target/dist/triad-merge-gui.exe README.md "$stage/"
          cp vendor/gpui-base/LICENSE-APACHE "$stage/LICENSE-gpui-base"
          cp vendor/jj-local-util/LICENSE "$stage/LICENSE-jj-local-util"
          (cd stage && 7z a -tzip "../dist/$NAME.zip" "$NAME")
      - uses: actions/upload-artifact@v4
        with:
          name: triad-windows-${{ matrix.arch }}
          path: dist/

  linux:
    name: Linux ${{ matrix.name }}
    needs: [ version, test ]
    strategy:
      matrix:
        include:
          - { name: x64, arch: x86_64, runner: ubuntu-latest }
          - { name: ARM64, arch: aarch64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    env:
      TRIAD_LINUX_ARCH: ${{ matrix.arch }}
      APPIMAGE: /out/dist/triad-merge-${{ needs.version.outputs.version }}-${{ matrix.arch }}-unknown-linux-gnu.AppImage
    steps:
      - uses: actions/checkout@v5
      - name: Let the Linux test machine write its results
        run: mkdir -p target/linux && chmod a+w target/linux
      - run: script/linux/run image
      - run: script/linux/run script/package ${{ matrix.arch }}-unknown-linux-gnu
      - name: Smoke test the AppImage on Wayland
        run: script/linux/run env APPIMAGE_EXTRACT_AND_RUN=1 "TRIAD_APP=$APPIMAGE" script/linux/smoke wayland
      - name: Smoke test the AppImage on X11
        run: script/linux/run env APPIMAGE_EXTRACT_AND_RUN=1 "TRIAD_APP=$APPIMAGE" script/linux/smoke x11
      - uses: actions/upload-artifact@v4
        with:
          name: triad-linux-${{ matrix.arch }}
          path: target/linux/dist/

  release:
    name: publish release
    if: github.ref_type == 'tag'
    needs: [ macos, windows, linux ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # GitHub shows each asset's SHA-256 digest, so script/package's checksum file stays out.
      - run: rm dist/*.sha256
      - env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/*
          --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "triad $GITHUB_REF_NAME"
