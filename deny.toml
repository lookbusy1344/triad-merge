# cargo-deny: licences, advisories, bans and sources (spec §10).

[graph]
all-features = true

[advisories]
yanked = "deny"
# Unmaintained crates deep in the GPUI and jj-lib trees are outside our control; flag only direct dependencies.
unmaintained = "workspace"

[licenses]
# triad is MIT. GPL and AGPL are rejected by omission: Zed's editor crates are GPL-3.0.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
