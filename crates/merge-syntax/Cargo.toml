[package]
name = "merge-syntax"
description = "Languages, grammars and syntax for triad: highlight spans and syntax-aware merge boundaries."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
# Test constructors for the crates that read its spans.
testing = []

[dependencies]
merge-core.workspace = true
thiserror.workspace = true
# Parses texts in chunks for their syntax colours, and regions for their boundaries.
tree-sitter.workspace = true
# Each language's grammar, for highlighting and syntax-aware merging
# (`docs/DESIGN.md` §B5.8).
tree-sitter-c-sharp.workspace = true
tree-sitter-go.workspace = true
tree-sitter-html.workspace = true
tree-sitter-javascript.workspace = true
tree-sitter-json.workspace = true
tree-sitter-python.workspace = true
tree-sitter-rust.workspace = true
tree-sitter-swift.workspace = true
tree-sitter-typescript.workspace = true
tracing.workspace = true

[dev-dependencies]
merge-core = { workspace = true, features = ["testing"] }
criterion.workspace = true

[[bench]]
name = "boundaries"
harness = false
